<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FoodNote - Khám phá Ẩm thực</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  </head>
  <body>
    <!-- Fullscreen Map -->
    <div id="map-container">
      <div id="map"></div>
    </div>

    <!-- Floating Search Header -->
    <div id="floating-header">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Tìm kiếm địa điểm, quán ăn..." id="search-input" />
        <div id="user-avatar" class="avatar-placeholder">👤</div>
      </div>
    </div>

    <!-- Pin Selector UI (Hidden by default) -->
    <div id="pin-selector-ui" class="hidden">
      <div class="pin-toast">Kéo bản đồ để chọn vị trí</div>
      <div class="pin-actions">
        <button id="btn-cancel-pin" class="btn-secondary">Hủy</button>
        <button id="btn-confirm-pin" class="btn-primary">Chọn vị trí này</button>
      </div>
    </div>
    
    <!-- Center Crosshair for Pin Selector -->
    <div id="center-crosshair" class="hidden">
      <img src="https://maps.gstatic.com/mapfiles/api-3/images/spotlight-poi2.png" alt="pin" style="width:27px; height:43px; transform: translate(-50%, -100%);">
    </div>

    <!-- Main Floating Action Button (FAB) -->
    <button class="fab" id="add-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Bottom Sheet for Notes List -->
    <div id="bottom-sheet" class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px;">
          <h2 class="sheet-title" style="margin-bottom: 0;">Khám phá</h2>
          <div style="display: flex; gap: 12px; align-items: center;">
            <label class="toggle-label" style="width: auto; gap: 6px; font-size: 0.8rem; color: #5f6368; font-weight: normal;">
              Bản đồ sạch
              <input type="checkbox" id="toggle-google-pois">
              <span class="toggle-switch"></span>
            </label>
            <label class="toggle-label" style="width: auto; gap: 6px; font-size: 0.8rem; color: #5f6368; font-weight: normal;">
              Chỉ của tôi
              <input type="checkbox" id="toggle-my-notes">
              <span class="toggle-switch"></span>
            </label>
          </div>
        </div>
        <div class="note-list" id="note-list">
          <div class="loading-text">Đang tải dữ liệu...</div>
        </div>
      </div>
    </div>

    <!-- Modals Overlay -->
    <div id="modal-overlay" class="hidden">
      <!-- Login Modal -->
      <div id="login-modal" class="modal hidden">
        <h2 class="modal-title">Đăng nhập</h2>
        <p class="modal-subtitle">Đăng nhập để lưu địa điểm yêu thích của bạn</p>
        <button id="btn-login-google" class="auth-btn google">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google">
          Tiếp tục với Google
        </button>
        <button id="btn-close-login" class="btn-text">Để sau</button>
      </div>

      <!-- Add Note Modal -->
      <div id="add-note-modal" class="modal hidden">
        <h2 class="modal-title">Thêm địa điểm</h2>
        <div class="form-group">
          <input type="text" id="add-title" placeholder="Tên quán ăn / địa điểm" class="input-field" autocomplete="off" />
        </div>
        <div class="form-group">
          <input type="text" id="add-address" placeholder="Địa chỉ chi tiết (Tùy chọn)" class="input-field" autocomplete="off" />
        </div>
        <div class="form-group">
          <textarea id="add-desc" placeholder="Trải nghiệm của bạn..." class="input-field textarea"></textarea>
        </div>
        <div class="form-group">
          <label for="add-image" class="image-upload-label">
            <span class="upload-icon">📷</span>
            <span id="upload-text">Thêm ảnh (Tùy chọn)</span>
          </label>
          <input type="file" id="add-image" accept="image/*" multiple class="hidden" />
        </div>
        <div class="form-group row">
          <label class="toggle-label">
            Công khai (Public)
            <input type="checkbox" id="add-privacy" checked>
            <span class="toggle-switch"></span>
          </label>
        </div>
        <div class="modal-actions">
          <button id="btn-cancel-note" class="btn-text">Hủy</button>
          <button id="btn-submit-note" class="btn-primary">Lưu lại</button>
        </div>
      </div>
      
      <!-- Detail Modal -->
      <div id="detail-modal" class="modal hidden" style="max-height: 85vh; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <h2 class="modal-title" id="detail-title" style="margin-bottom:0;"></h2>
          <button id="btn-close-detail" class="btn-text" style="padding: 4px 8px;">✕</button>
        </div>
        <p class="modal-subtitle" id="detail-address"></p>
        
        <div id="detail-images" class="image-carousel" style="display:flex; overflow-x:auto; gap:8px; margin-bottom: 16px;"></div>
        
        <p id="detail-desc" style="font-size:0.95rem; line-height: 1.5; margin-bottom: 16px;"></p>
        
        <div style="border-top: 1px solid var(--border); padding-top: 16px;">
          <h3 style="font-size: 1.1rem; margin-bottom: 12px;">Đánh giá cộng đồng</h3>
          <div id="review-list" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;"></div>
          
          <button id="btn-open-review-form" class="btn-secondary" style="width: 100%;">🖊️ Viết đánh giá</button>
          
          <div id="add-review-form" class="hidden" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
            <textarea id="review-comment" placeholder="Bạn thấy quán này thế nào?" class="input-field textarea"></textarea>
            
            <label for="review-image" class="image-upload-label">
              <span class="upload-icon">📷</span>
              <span id="review-upload-text">Thêm ảnh</span>
            </label>
            <input type="file" id="review-image" accept="image/*" multiple class="hidden" />
            
            <div style="display: flex; gap: 8px;">
              <button id="btn-submit-review" class="btn-primary" style="flex:1;">Gửi đánh giá</button>
              <button id="btn-cancel-review" class="btn-text">Hủy</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
